plasmidfinder:
  options: "-l 0.80 -t 0.80"
  assembler: shovill

blastn:
  options: "-perc_identity 99.0"
  assembler: shovill
  database : OXAndm

pointfinder:
    options: --species 'Enterococcus faecalis'
    assembler: shovill

lrefinder:
    database : [elmDB]
    reads: True

kmeraligner:
    database : [vancomycin, vancomycinOperon]
    reads: True
